<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload font (EB Garamond) — xem `src/ui/stitch-theme.css` để biết vì sao bỏ `@import`
         từ Google Fonts. Toàn site dùng DUY NHẤT EB Garamond, nên preload 2 subset cần ngay
         khi vẽ trang đầu (latin + vietnamese, kiểu normal); latin-ext và bản italic để trình
         duyệt tự tải theo `unicode-range`/`font-style` khi thực sự gặp.
         `crossorigin` là BẮT BUỘC kể cả với font cùng origin — thiếu nó trình duyệt sẽ tải
         lại lần hai thay vì dùng bản đã preload. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/eb-garamond-latin-normal-400_800.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/eb-garamond-vietnamese-normal-400_800.woff2" />

    <!-- Xác minh quyền sở hữu Google Search Console (property https://qiching.org/).
         KHÔNG được xoá kể cả sau khi verify thành công — gỡ đi là mất quyền sở hữu property.
         Chọn phương thức "HTML tag" thay vì "HTML file" vì Cloudflare Pages đang SPA-fallback:
         mọi URL không tồn tại đều trả HTTP 200, dễ làm bước verify bằng file thất bại. -->
    <meta name="google-site-verification" content="3wnaZHQR4sB9K2cFjwEaCEkd4D8-EJlS2AkJLxr0Yo8" />

    <!-- KHÔNG khai title/description/canonical/OG ở đây nữa.
         Từ Giai đoạn C, metadata do `src/ui/MetaTrang.tsx` render theo từng route và React 19
         tự hoist lên <head>. Giữ thêm bản tĩnh ở đây sẽ thành hai bộ thẻ song song, trùng và
         mâu thuẫn nhau (yêu cầu 1 của Giai đoạn C trong project-brain/10-ke-hoach-seo.md).
         Bot không chạy JS đọc được metadata nhờ HTML đã prerender ở Giai đoạn B. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
