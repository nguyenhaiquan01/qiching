    <!-- Preload font (Manrope) — xem `src/ui/stitch-theme.css` để biết vì sao bỏ `@import`
         từ Google Fonts. Toàn site dùng DUY NHẤT Manrope, nên preload 2 subset cần ngay khi
         vẽ trang đầu (latin + vietnamese); latin-ext để trình duyệt tự tải theo `unicode-range`
         khi thực sự gặp ký tự thuộc dải đó.
         `crossorigin` là BẮT BUỘC kể cả với font cùng origin — thiếu nó trình duyệt sẽ tải
         lại lần hai thay vì dùng bản đã preload. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/manrope-latin-normal-200_800.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/manrope-vietnamese-normal-200_800.woff2" />

    <!-- Xác minh quyền sở hữu Google Search Console (property https://qiching.org/).
         KHÔNG được xoá kể cả sau khi verify thành công — gỡ đi là mất quyền sở hữu property.
         Chọn phương thức "HTML tag" thay vì "HTML file" vì Cloudflare Pages đang SPA-fallback:
         mọi URL không tồn tại đều trả HTTP 200, dễ làm bước verify bằng file thất bại. -->
    <meta name="google-site-verification" content="3wnaZHQR4sB9K2cFjwEaCEkd4D8-EJlS2AkJLxr0Yo8" />

         lại để mỗi trang chỉ còn đúng một <title>/description/canonical, tránh metadata trùng. -->
